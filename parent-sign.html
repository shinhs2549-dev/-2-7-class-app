<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>결석 신고서 - 학부모 서명</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root{
    --paper:#F6F1E4; --ink:#2B2620; --ochre:#B4762A;
    --forest:#3E5C42; --forest-deep:#2A3F2D; --line:#D8CDB4;
    --card:#FFFDF7; --danger:#A5432F;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--paper); color:var(--ink); font-family:'Noto Sans KR', sans-serif; min-height:100vh; }
  .wrap{ max-width:560px; margin:0 auto; padding:28px 20px 60px; }
  h1,h2,h3{ font-family:'Noto Serif KR', serif; margin:0; }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:10px; padding:22px 24px; margin-bottom:16px; }
  h1{ font-size:20px; margin-bottom:6px; }
  p.sub{ color:#6b6455; font-size:13.5px; margin:0 0 20px; }
  .row{ display:flex; justify-content:space-between; padding:7px 0; border-bottom:1px solid var(--line); font-size:14px; }
  .row:last-child{ border-bottom:none; }
  .row .label{ color:#8a8270; }
  .row .value{ font-weight:500; text-align:right; }
  .field{ margin-bottom:16px; }
  .field label{ display:block; font-size:13px; font-weight:500; margin-bottom:6px; color:var(--forest-deep); }
  .field input, .field textarea{ width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:6px; font-size:14.5px; font-family:'Noto Sans KR', sans-serif; background:#fff; }
  canvas#sigCanvas{ width:100%; height:160px; border:1.5px dashed var(--line); border-radius:6px; background:#fff; touch-action:none; }
  .primary-btn{ width:100%; padding:13px; background:var(--forest); color:#fff; border:none; border-radius:6px; font-size:15px; font-weight:500; cursor:pointer; margin-top:6px; }
  .primary-btn:disabled{ background:#B9B29B; cursor:not-allowed; }
  .ghost-btn{ background:none; border:1px solid var(--line); border-radius:6px; padding:8px 12px; font-size:13px; cursor:pointer; color:var(--ink); }
  .msg{ text-align:center; padding:60px 20px; color:#6b6455; font-size:14.5px; }
  .msg.err{ color:var(--danger); }
</style>
</head>
<body>
<div class="wrap">
  <div id="loadingMsg" class="msg">불러오는 중...</div>

  <div id="formArea" style="display:none;">
    <div class="card" id="printCard">
      <h1>결석 신고서 확인</h1>
      <p class="sub">아래 내용을 확인하시고 서명해주세요.</p>
      <div class="row"><span class="label">학생</span><span class="value" id="viewStudent"></span></div>
      <div class="row"><span class="label">결석 유형</span><span class="value" id="viewType"></span></div>
      <div class="row"><span class="label">기간</span><span class="value" id="viewPeriod"></span></div>
      <div class="row"><span class="label">증빙자료</span><span class="value" id="viewEvidence"></span></div>
      <div class="row"><span class="label">사유</span><span class="value" id="viewReason"></span></div>
    </div>

    <div class="card" id="parentOpinionCard" style="display:none;">
      <h3 style="font-size:15px; margin-bottom:10px;">학부모 의견서</h3>
      <p class="sub" style="margin-bottom:14px;">학부모 의견서는 상습적이지 않은 2일 이내 결석에만 사용할 수 있어요. 사유를 구체적으로 적어주세요.</p>
      <div class="field"><label>학부모 의견</label><textarea id="parentOpinion" rows="3" placeholder="구체적인 사유"></textarea></div>
      <div class="field" style="margin-bottom:0;"><label>학생과의 관계</label><input type="text" id="parentRelation" placeholder="예: 모, 부"></div>
    </div>

    <div class="card">
      <h3 style="font-size:15px; margin-bottom:10px;">보호자 서명</h3>
      <canvas id="sigCanvas"></canvas>
      <div style="display:flex; justify-content:flex-end; margin-top:8px;">
        <button class="ghost-btn" onclick="clearSignature()">다시 서명</button>
      </div>
    </div>

    <button class="primary-btn" id="submitBtn" onclick="handleParentSubmit()">제출하기</button>
    <p id="submitError" style="display:none; color:var(--danger); font-size:13px; margin-top:8px; text-align:center;"></p>
  </div>

  <div id="doneMsg" class="msg" style="display:none;">
    ✅ 제출이 완료되었어요.<br>담임 선생님께 전달되었습니다.
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<script>
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBars-AalN-eZKCjGIOgOqkQ9oCHyDSLqU",
  authDomain: "grade-7class.firebaseapp.com",
  projectId: "grade-7class",
  storageBucket: "grade-7class.firebasestorage.app",
  messagingSenderId: "304110691750",
  appId: "1:304110691750:web:7b7ce68828f538802adb67"
};
firebase.initializeApp(FIREBASE_CONFIG);
const auth = firebase.auth();
const db = firebase.firestore();
const storage = firebase.storage();

const params = new URLSearchParams(location.search);
const absenceId = params.get("id");
let absenceData = null;

function showMsg(text, isErr){
  document.getElementById("loadingMsg").textContent = text;
  document.getElementById("loadingMsg").className = "msg" + (isErr ? " err" : "");
  document.getElementById("loadingMsg").style.display = "block";
  document.getElementById("formArea").style.display = "none";
}

async function init(){
  if(!absenceId){ showMsg("잘못된 링크예요.", true); return; }
  try{
    await auth.signInAnonymously();
    const doc = await db.collection("absences").doc(absenceId).get();
    if(!doc.exists){ showMsg("결석계를 찾을 수 없어요.", true); return; }
    absenceData = doc.data();
    if(absenceData.status === "submitted"){
      document.getElementById("loadingMsg").style.display = "none";
      document.getElementById("doneMsg").style.display = "block";
      document.getElementById("doneMsg").textContent = "✅ 이미 제출이 완료된 결석계예요.";
      return;
    }
    renderForm();
  }catch(e){
    console.error(e);
    showMsg("불러오는 중 오류가 발생했어요.", true);
  }
}

function renderForm(){
  document.getElementById("loadingMsg").style.display = "none";
  document.getElementById("formArea").style.display = "block";
  document.getElementById("viewStudent").textContent = `2학년 7반 ${absenceData.num}번 ${absenceData.name}`;
  document.getElementById("viewType").textContent = absenceData.type;
  document.getElementById("viewPeriod").textContent = `${absenceData.startDate} ~ ${absenceData.endDate}`;
  document.getElementById("viewEvidence").textContent = (absenceData.evidenceTypes || []).join(", ") || "없음";
  document.getElementById("viewReason").textContent = absenceData.reason;

  if((absenceData.evidenceTypes || []).includes("학부모의견서")){
    document.getElementById("parentOpinionCard").style.display = "block";
  }
  initSignaturePad();
}

// ---------- 서명 캔버스 ----------
let sigCtx, drawing = false, hasSignature = false;
function initSignaturePad(){
  const canvas = document.getElementById("sigCanvas");
  const ratio = window.devicePixelRatio || 1;
  canvas.width = canvas.clientWidth * ratio;
  canvas.height = canvas.clientHeight * ratio;
  sigCtx = canvas.getContext("2d");
  sigCtx.scale(ratio, ratio);
  sigCtx.lineWidth = 2.4;
  sigCtx.lineCap = "round";
  sigCtx.strokeStyle = "#2B2620";

  const pos = (e) => {
    const rect = canvas.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    return {x: t.clientX - rect.left, y: t.clientY - rect.top};
  };
  const start = (e) => { drawing = true; hasSignature = true; const p = pos(e); sigCtx.beginPath(); sigCtx.moveTo(p.x, p.y); e.preventDefault(); };
  const move = (e) => { if(!drawing) return; const p = pos(e); sigCtx.lineTo(p.x, p.y); sigCtx.stroke(); e.preventDefault(); };
  const end = () => { drawing = false; };

  canvas.addEventListener("mousedown", start);
  canvas.addEventListener("mousemove", move);
  window.addEventListener("mouseup", end);
  canvas.addEventListener("touchstart", start);
  canvas.addEventListener("touchmove", move);
  canvas.addEventListener("touchend", end);
}
function clearSignature(){
  const canvas = document.getElementById("sigCanvas");
  sigCtx.clearRect(0, 0, canvas.width, canvas.height);
  hasSignature = false;
}

// ---------- 제출 ----------
async function handleParentSubmit(){
  const errEl = document.getElementById("submitError");
  errEl.style.display = "none";

  const needsOpinion = (absenceData.evidenceTypes || []).includes("학부모의견서");
  const parentOpinion = document.getElementById("parentOpinion").value.trim();
  const parentRelation = document.getElementById("parentRelation").value.trim();

  if(!hasSignature){
    errEl.textContent = "서명을 해주세요.";
    errEl.style.display = "block";
    return;
  }
  if(needsOpinion && (!parentOpinion || !parentRelation)){
    errEl.textContent = "학부모 의견과 학생과의 관계를 입력해주세요.";
    errEl.style.display = "block";
    return;
  }

  const btn = document.getElementById("submitBtn");
  btn.disabled = true;
  btn.textContent = "제출 중...";

  try{
    // 확인 카드 + 서명을 하나의 이미지로 캡처
    const canvas = await html2canvas(document.getElementById("printCard"), {backgroundColor:"#ffffff", scale:2});
    const sigCanvas = document.getElementById("sigCanvas");
    const combined = document.createElement("canvas");
    combined.width = canvas.width;
    combined.height = canvas.height + 200;
    const ctx = combined.getContext("2d");
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, combined.width, combined.height);
    ctx.drawImage(canvas, 0, 0);
    ctx.font = "28px sans-serif";
    ctx.fillStyle = "#2B2620";
    ctx.fillText("보호자 서명", 20, canvas.height + 40);
    ctx.drawImage(sigCanvas, 20, canvas.height + 55, sigCanvas.width * 0.4, sigCanvas.height * 0.4);
    const base64 = combined.toDataURL("image/png").split(",")[1];

    const ref = storage.ref().child(`absences/${absenceId}_final.png`);
    await ref.putString(base64, "base64", {contentType: "image/png"});
    const imageUrl = await ref.getDownloadURL();

    await db.collection("absences").doc(absenceId).update({
      status: "submitted",
      parentOpinion: needsOpinion ? parentOpinion : "",
      relation: needsOpinion ? parentRelation : "",
      imageUrl,
      signedAt: firebase.firestore.FieldValue.serverTimestamp()
    });

    document.getElementById("formArea").style.display = "none";
    document.getElementById("doneMsg").style.display = "block";
  }catch(e){
    console.error(e);
    errEl.textContent = "제출 중 오류가 발생했어요.";
    errEl.style.display = "block";
    btn.disabled = false;
    btn.textContent = "제출하기";
  }
}

init();
</script>
</body>
</html>
